<h1>Diffusjon og osmose</h1>
<p>Vann beveger seg gjennom en membran mot siden med mest oppløst stoff. Det kalles osmose. Store molekyler slipper ikke gjennom membranen, og derfor kan vann presses inn i eller trekkes ut av en celle.</p>
