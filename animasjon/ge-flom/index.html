<h1>Flom: regn, jord og asfalt</h1>
<p>Når det regner mye på kort tid, renner vannet ut i elva. Hvor mye som renner av, og hvor fort, avhenger av bakken. Asfalt og tak slipper alt vannet rett ut, mens skog og jord holder på det.</p>
