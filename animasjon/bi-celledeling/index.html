<h1>Celledeling: mitose og meiose</h1>
<p>Ved mitose deler en celle seg i to helt like celler. Det skjer når kroppen vokser og reparerer seg. Ved meiose blir det fire kjønnsceller med halvparten så mange kromosomer, og alle er forskjellige.</p>
