<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fant ikke siden · Realfagsrommet</title>
<meta name="robots" content="noindex">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box;background:#12161B;color:#ECEFF1;font:17px/1.55 system-ui,sans-serif}main{max-width:52ch}h1{font:italic 500 2.4rem/1.1 Georgia,serif;margin:0 0 12px}p{color:#A9B4BF}a{color:#58C4DD}</style>
</head>
<body>
<main>
<h1>Fant ikke siden</h1>
<p>Adressen finnes ikke i Realfagsrommet. Kanskje lenken er skrevet feil, eller animasjonen har fått nytt navn.</p>
<p><a id="hjem" href="/">Gå til forsiden</a></p>
</main>
<script>
// På GitHub Pages ligger nettstedet i en undermappe (/realfagsrommet/). Finn den ut fra adressen.
(function(){var seg=location.pathname.split('/')[1];if(/\.github\.io$/.test(location.hostname)&&seg){document.getElementById('hjem').href='/'+seg+'/'}})();
</script>
</body>
</html>
